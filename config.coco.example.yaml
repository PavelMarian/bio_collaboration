models:
  floc_segmentation:
    backend: torchvision
    architecture: maskrcnn_resnet50_fpn_v2
    weights: models/floc_maskrcnn.pt
    coco_annotations: annotations/floc_instances.json
  microorganism_detection:
    backend: torchvision
    architecture: fasterrcnn_resnet50_fpn_v2
    weights: models/microorganisms_fasterrcnn.pt
    coco_annotations: annotations/microorganism_instances.json

inference:
  device: cpu
  image_size: 960
  floc_confidence: 0.25
  microorganism_confidence: 0.20
  iou_threshold: 0.60
  max_detections: 300
  floc_class_name: floc

microorganism_classes:
  - attached_ciliates
  - filamentous_bacteria
  - rotifers
  - testate_amoebae
  - free_swimming_ciliates
  - nematoda
  - gastrotrichs
